; KittyBuddy Studio firmware
; Target: Seeed XIAO ESP32-C3 + SH1106 128x64 OLED (SDA=GPIO6/D4, SCL=GPIO7/D5)

[platformio]
default_envs = xiao_esp32c3

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Change these before flashing. OTA_PASSWORD is the token the web app sends
; (Settings > ota.password) to authorise sync, config and firmware updates.
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D WIFI_AP_SSID=\"KittyBuddy-Studio\"
  -D WIFI_AP_PASS=\"kittybuddy\"
  -D OTA_PASSWORD=\"kittybuddy-ota\"

lib_deps =
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit SH110X@^2.1.10
  adafruit/Adafruit BusIO@^1.14.1
  mathieucarbou/ESPAsyncWebServer@^3.3.0
  bblanchon/ArduinoJson@^7.0.0

; default.csv has two app slots (required for OTA) and a 1.5 MB LittleFS partition
board_build.partitions = default.csv
board_build.filesystem = littlefs
